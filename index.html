<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>carrie's brain</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100;0,400;1,100;1,400&amp;display=swap">
    <link rel="stylesheet" href="styles.css">
    <!-- Show the boot screen once per visit. After that, the home page opens straight to the desktop. -->
    <script>
      try {
        if (!sessionStorage.getItem("booted")) document.documentElement.classList.add("booting");
      } catch (e) {
        document.documentElement.classList.add("booting");
      }
    </script>
    <script src="script.js" defer></script>
    <script src="sky.js" defer></script>
    <script src="rage.js" defer></script>
    <script src="dream.js" defer></script>
  </head>
  <body>
    <!-- Boot screen: script.js types the welcome line, then asks for the password. -->
    <div class="boot" id="boot">
      <div class="boot-inner">
        <p><span id="boot-text" data-text="welcome to carrie's brain"></span><span class="cursor" id="boot-cursor"></span></p>
        <form class="boot-login" id="boot-login" autocomplete="off">
          <label for="boot-password">&gt; enter password:</label>
          <input id="boot-password" type="text" autocomplete="off" spellcheck="false" autocapitalize="off">
        </form>
        <p class="boot-message" id="boot-message" aria-live="assertive"></p>
        <div class="boot-log" id="boot-log" aria-hidden="true"></div>
      </div>
    </div>

    <a class="skip-link" href="#main">skip to content</a>

    <div class="screen" id="screen">
      <!-- Shared sidebar: identical on every page except which link has aria-current="page". Change it in all .html files. -->
      <header class="sidebar">
        <p class="sidebar-label" aria-hidden="true">:)</p>
        <nav class="tree" aria-label="primary">
          <a class="tree-root" aria-current="page" href="index.html">~/carries-brain</a>
          <ul>
            <li>
              <a class="tree-dir" href="portfolio.html">portfolio/</a>
              <ul>
                <li><a href="consent.html">consent/</a></li>
                <li><a href="medica.html">medica/</a></li>
                <li><a href="thrivent.html">thrivent/</a></li>
                <li><a href="ahip.html">ahip/</a></li>
                <li><a href="two-mules.html">two-mules/</a></li>
              </ul>
            </li>
            <li>
              <a class="tree-dir" href="sketchbook.html">sketchbook/</a>
              <ul>
                <li><a href="project-1.html">project-1/</a></li>
              </ul>
            </li>
            <li><a href="resume.html">resume.txt</a></li>
          </ul>
        </nav>
        <p class="sidebar-meta">carrie markusen<br>physical + digital design</p>
      </header>

      <main id="main" class="window" tabindex="-1">
        <div class="titlebar">
          <h1 class="titlebar-path">~/carries-brain/dream.exe</h1>
          <span id="dream-hint">[ drag to grow ]</span>
        </div>

        <!-- The dream: dream.js grows a brain here, starting from a :). -->
        <div class="home-dream">
          <canvas class="dream-canvas" id="dream" aria-label="a brain growing its own folds, starting from a smiley face"></canvas>
        </div>
      </main>

      <!-- Shared status bar: identical on every page. script.js runs the command line and the clock. -->
      <footer class="statusbar">
        <form class="cli" id="cli" autocomplete="off">
          <label for="cli-input">carrie@brain ~&gt;</label>
          <input id="cli-input" type="text" spellcheck="false" autocapitalize="off" placeholder="type help">
        </form>
        <p class="cli-output" id="cli-output" aria-live="polite"></p>
        <p class="status"><span id="uptime"></span><span id="clock"></span></p>
      </footer>
    </div>
  </body>
</html>
